version: 2

sources:
  - name: clinical_trials_gold

    database: nimble-crane-431005-f8
    schema: clinical_trials

    description: >
      Gold analytics datasets generated by the
      Databricks clinical trial data pipeline
      and exported to BigQuery.

    tables:
      - name: gold_yearly_summary
        description: >
          Trial counts and enrollment metrics
          aggregated by start year, study type,
          phase, and status.

      - name: gold_country_summary
        description: >
          Distinct trial counts aggregated by
          country and year.

      - name: gold_condition_trends
        description: >
          Trial counts aggregated by condition
          and study year.
